# Terax 中文版自动构建流水线
#
# 流程:每天北京时间 10:00(UTC 02:00)检查官方 crynta/terax-ai 最新 release,
# 出现未构建过的新版本时:
#   check   → 比对版本,创建草稿 Release;
#   prepare → 单次完成所有平台一致的工作:克隆上游 tag 源码、挂载汉化补丁
#             (apply_i18n.py)、前端构建(tsc + vite)与 dist 精确替换汉化
#             (patch_dist.mjs),补丁后的源码连同前端产物打成 artifact;
#   build   → 各平台腿下载该 artifact,只执行必须按平台编译打包的部分:
#             Rust sidecar(build:cli)、主程序编译与安装包(tauri-action);
#   publish → 合并翻译覆盖率与各平台产物清单,草稿转正式发布。
#
# 平台无关的重复工作只跑一次,每条构建腿省去克隆、补丁与前端构建,降低并行
# 腿的资源占用;产物(dist)跨平台字节一致,汉化覆盖率报告也随之只产一份。
#
# 本仓库只保留流程与翻译表,不在本地维护任何上游源码。
# 手动触发:Actions 页面 Run workflow,可勾选 force 强制重建当前上游最新版。

name: Terax 中文版构建

on:
  schedule:
    - cron: '0 2 * * *' # UTC 02:00 = 北京时间 10:00(GitHub cron 允许几分钟级延迟)
  workflow_dispatch:
    inputs:
      force:
        description: 忽略版本检查,强制重建上游最新版
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: terax-cn-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: crynta/terax-ai
  # Windows runner 的 Python 默认用 cp1252 写 stdout,强制 UTF-8 覆盖
  # apply_i18n 步骤与 beforeBuildCommand 里调用的 patch_dist
  PYTHONUTF8: '1'

jobs:
  check:
    name: 检查上游新版本
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      version: ${{ steps.check.outputs.version }}
      cn_tag: ${{ steps.check.outputs.cn_tag }}
    steps:
      - name: 比对上游 release 与本仓库已有中文版
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream_tag="$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)"
          version="${upstream_tag#v}"
          cn_tag="v${version}-cn"
          build=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            build=true
            echo "手动触发 force=true,强制构建"
          elif ! gh release view "$cn_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            build=true
            echo "发现未构建的上游新版本"
          fi
          {
            echo "upstream_tag=$upstream_tag"
            echo "version=$version"
            echo "cn_tag=$cn_tag"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "上游: $upstream_tag | 中文版: $cn_tag | 需要构建: $build"

      - name: 清理遗留草稿并创建本次构建的草稿 Release
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CN_TAG: ${{ steps.check.outputs.cn_tag }}
          VERSION: ${{ steps.check.outputs.version }}
          UPSTREAM_TAG: ${{ steps.check.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          # 删除历史遗留的同名草稿(tauri-action 曾把部分资产传进隐藏草稿,公开 release 上看不到)
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == true and .tag_name == $env.CN_TAG) | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            echo "已删除遗留草稿 release #$id"
          done
          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<EOF
          Terax 中文分发(非官方),基于官方 [${UPSTREAM_TAG}](https://github.com/crynta/terax-ai/releases/tag/${UPSTREAM_TAG})自动构建。

          ⚠️ 非官方翻译版本(社区分发):与 Crynta/官方无隶属;按 Apache-2.0 保留原许可与版权声明,未使用官方 Logo,安装包内附带许可文本。

          - 界面文案采用「构建后精确替换」方案汉化,不影响程序逻辑;
          - 应用名为 Terax-CN,可与官方版并存安装;
          - Linux AppImage 兼容性已修复;deb/rpm 面向 Debian 12 / Ubuntu 22.04+ 等新版系;
          - 请勿在应用内点击官方检查更新,更新以本仓库 Release 为准;
          - 翻译覆盖率与各平台产物清单见附件 i18n-report.json。
          EOF
          sed -i 's/^          //' "$notes_file"
          gh release create "$CN_TAG" --draft --target "$GITHUB_SHA" \
            --title "Terax $VERSION 中文分发" --notes-file "$notes_file" || echo "草稿已存在,复用"

  prepare:
    name: 准备(单次):源码补丁 + 前端构建
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出本仓库(流程与翻译表)
        uses: actions/checkout@v7

      - name: 克隆上游源码 ${{ needs.check.outputs.upstream_tag }}
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.check.outputs.upstream_tag }}
        run: |
          git clone --depth 1 --branch "$UPSTREAM_TAG" "https://github.com/$UPSTREAM_REPO.git" terax
          echo "上游 commit: $(git -C terax rev-parse HEAD)"

      # pnpm 版本读取 terax/package.json 的 packageManager 字段,随上游自动同步
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: terax/package.json

      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: terax/pnpm-lock.yaml

      - name: 挂载汉化补丁
        run: python scripts/apply_i18n.py --upstream terax --map i18n/translations.json --report "${{ runner.temp }}/i18n-report.json"

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        working-directory: terax

      # 补丁挂载后的 beforeBuildCommand 形如:
      #   "<按平台的 sidecar 构建> && <前端构建> && node <patch_dist 绝对路径> --dist … --map …"
      # 前端构建与 dist 汉化的产物跨平台字节一致,在此单次执行;sidecar 构建是
      # Rust 编译,必须留给各平台腿。形态由 tests/test_local.py 锁定,若上游
      # 重构构建链,下面的形态检查会显式失败并打印实际值。
      - name: 构建前端并汉化 dist(跨平台一致,单次执行)
        shell: bash
        run: |
          set -euo pipefail
          bbc="$(jq -r '.build.beforeBuildCommand' terax/src-tauri/tauri.conf.json)"
          case "$bbc" in
            *" && node "*) : ;;
            *) echo "beforeBuildCommand 未挂载补丁段: $bbc"; exit 1 ;;
          esac
          rest="${bbc#* && }"        # 去掉第一段(sidecar 构建)
          patch_cmd="${rest##* && }" # 最后一段 = node patch_dist.mjs …(绝对路径且无空格)
          frontend="${rest% && *}"   # 中段 = 前端构建
          case "$patch_cmd" in
            node\ *) : ;;
            *) echo "补丁段形态异常: $patch_cmd"; exit 1 ;;
          esac
          cd terax
          echo "前端构建: $frontend"
          eval "$frontend"
          echo "dist 汉化: $patch_cmd"
          eval "$patch_cmd"

      # 前端产物已就绪并随源码打包,各平台腿不再重复构建前端
      - name: beforeBuildCommand 只保留 sidecar 构建
        shell: bash
        run: |
          set -euo pipefail
          bbc="$(jq -r '.build.beforeBuildCommand' terax/src-tauri/tauri.conf.json)"
          leg_cmd="${bbc%% && *}"
          tmp="$(mktemp)"
          jq --arg cmd "$leg_cmd" '.build.beforeBuildCommand = $cmd' terax/src-tauri/tauri.conf.json > "$tmp"
          mv "$tmp" terax/src-tauri/tauri.conf.json
          echo "各平台腿 beforeBuildCommand: $leg_cmd"

      - name: 打包补丁后源码(含前端产物;排除依赖、Rust 产物与上游 .git)
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/terax-patched-src.tar.gz" \
            --exclude='terax/.git' \
            --exclude='*/node_modules' \
            --exclude='terax/src-tauri/target' \
            terax
          du -h "$RUNNER_TEMP/terax-patched-src.tar.gz"

      - name: 上传补丁后源码(供各平台构建腿下载)
        uses: actions/upload-artifact@v7
        with:
          name: terax-patched-src
          path: ${{ runner.temp }}/terax-patched-src.tar.gz
          retention-days: 1

      - name: 上传汉化覆盖率报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: i18n-report
          path: ${{ runner.temp }}/i18n-report.json
          retention-days: 1
          if-no-files-found: ignore

  build:
    name: 构建 (${{ matrix.platform }}${{ matrix.rust-target != '' && format(' · {0}', matrix.rust-target) || '' }})
    if: needs.check.outputs.build == 'true'
    needs: [check, prepare]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 暂停;恢复时取消注释并勾选 force(否则已存在的 release 会跳过构建)
          # - platform: macos-latest
          #   args: --target aarch64-apple-darwin
          #   rust-target: aarch64-apple-darwin
          # - platform: macos-latest
          #   args: --target x86_64-apple-darwin
          #   rust-target: x86_64-apple-darwin
          # Linux 固定 ubuntu-22.04:glibc 2.35 + webkit2gtk-4.1 即 Tauri v2 兼容下限
          # (musl 不可行:GUI 依赖系统 GTK/WebKitGTK C 库,无 musl 版;更低版本发行版
          # 本身缺 webkit2gtk-4.1,降低构建机版本无额外收益)
          - platform: ubuntu-22.04
            args: ''
            rust-target: ''
          - platform: windows-latest
            args: ''
            rust-target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      # 源码、汉化补丁与前端产物由 prepare 单次产出;各腿只做按平台的编译与打包
      - name: 下载 prepare 产出的补丁后源码
        uses: actions/download-artifact@v7
        with:
          name: terax-patched-src
          path: ${{ runner.temp }}

      - name: 解开源码包(terax/ 落在工作区根)
        shell: bash
        run: tar -xzf "$RUNNER_TEMP/terax-patched-src.tar.gz"

      - name: 安装 Linux 构建依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev patchelf

      # pnpm 版本读取 terax/package.json 的 packageManager 字段,随上游自动同步
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: terax/package.json

      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: terax/pnpm-lock.yaml

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./terax/src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      # tauri-action 经 pnpm 调用项目内的 @tauri-apps/cli,需要 node_modules;
      # pnpm store 跨腿共享缓存,实际只是链接,开销很小
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        working-directory: terax

      - name: 构建 Tauri 应用
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 上游 build-cli.mjs 依赖该变量确定 sidecar(terax-cli)的编译目标
          TERAX_CLI_TARGET: ${{ matrix.rust-target }}
        with:
          projectPath: terax
          args: ${{ matrix.args }}

      # 与官方 release.yml 同源的 AppImage 兼容修复:剥离打包进镜像的陈旧
      # libwayland 库(宿主 1.20 vs 新 Mesa 需要 1.22+ 符号,否则 EGL_BAD_PARAMETER),
      # 重打包后用 --clobber 覆盖已上传的同名资产。无签名环节。
      - name: 修复 AppImage wayland 兼容并覆盖上传
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CN_TAG: ${{ needs.check.outputs.cn_tag }}
        run: |
          set -euo pipefail
          APPIMAGE="$(ls terax/src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)"
          BASENAME="$(basename "$APPIMAGE")"
          echo "修复: $APPIMAGE"
          WORK="$(mktemp -d)"
          cp "$APPIMAGE" "$WORK/"
          pushd "$WORK" >/dev/null
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null
          # productName 为 Terax-CN 时主二进制名可能为 terax/terax-cn/Terax-CN,做宽匹配
          ls squashfs-root/usr/bin | grep -qi '^terax' || { echo "AppImage 内缺少 terax 主程序"; ls squashfs-root/usr/bin; exit 1; }
          find squashfs-root \( -type f -o -type l \) -name 'libwayland-*.so*' -print -delete
          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$BASENAME"
          rm -rf squashfs-root
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null
          if find squashfs-root -name 'libwayland-*.so*' -print -quit | grep -q .; then
            echo "重打包后仍存在 wayland 库"; exit 1
          fi
          ls squashfs-root/usr/bin | grep -qi '^terax' || { echo "重打包后缺少 terax 主程序"; ls squashfs-root/usr/bin; exit 1; }
          popd >/dev/null
          cp "$WORK/$BASENAME" "$APPIMAGE"
          gh release upload "$CN_TAG" "$APPIMAGE" --clobber --repo "$GITHUB_REPOSITORY"
          echo "AppImage 已修复并覆盖上传"

      - name: 上传安装包到草稿 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CN_TAG: ${{ needs.check.outputs.cn_tag }}
        run: |
          set -euo pipefail
          files=()
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            for f in terax/src-tauri/target/release/bundle/nsis/*.exe terax/src-tauri/target/release/bundle/msi/*.msi; do
              if [ -f "$f" ]; then files+=("$f"); fi
            done
          else
            for f in terax/src-tauri/target/release/bundle/deb/*.deb \
                     terax/src-tauri/target/release/bundle/rpm/*.rpm \
                     terax/src-tauri/target/release/bundle/appimage/*.AppImage; do
              if [ -f "$f" ]; then files+=("$f"); fi
            done
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "未找到安装包"; exit 1
          fi
          gh release upload "$CN_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          echo "已上传 ${#files[@]} 个安装包"

      - name: 记录打包产物清单(诊断)
        if: always()
        shell: bash
        run: |
          {
            echo "=== target/release/bundle 产物清单 ==="
            find terax/src-tauri/target/release/bundle -type f 2>/dev/null || echo '(bundle 目录不存在)'
          } > "${{ runner.temp }}/bundle-listing.txt"
          cat "${{ runner.temp }}/bundle-listing.txt"

      - name: 上传打包产物清单(诊断)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-listing-${{ matrix.platform }}${{ matrix.rust-target != '' && format('-{0}', matrix.rust-target) || '' }}
          path: ${{ runner.temp }}/bundle-listing.txt
          retention-days: 1
          if-no-files-found: ignore

  publish:
    name: 发布 Release
    needs: [check, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CN_TAG: ${{ needs.check.outputs.cn_tag }}
    steps:
      - name: 下载汉化覆盖率报告(prepare 单份产出)
        uses: actions/download-artifact@v7
        with:
          name: i18n-report
          path: report

      - name: 下载各平台打包产物清单
        uses: actions/download-artifact@v7
        with:
          pattern: bundle-listing-*
          path: listings

      - name: 将草稿 Release 转为正式发布并写入构建信息
        run: |
          set -euo pipefail
          # 合并为单一 JSON:翻译覆盖率(prepare 产出,仅一份)+ 按平台打包产物清单,
          # 避免 release 上累积多份同用途文件
          mkdir -p merged
          for d in listings/*/; do
            name="$(basename "$d")"
            [ -f "$d/bundle-listing.txt" ] || echo '(无清单)' > "$d/bundle-listing.txt"
            jq -n --arg name "$name" --rawfile ls "$d/bundle-listing.txt" \
              '{($name): $ls}' > "merged/$name.json"
          done
          bundles="$(jq -s 'add' merged/*.json)"
          jq -n --slurpfile i18n report/i18n-report.json --argjson bundles "$bundles" \
            '{i18n: $i18n[0], bundles: $bundles}' > merged/i18n-report.json
          # 清理历史遗留的报告资产(旧命名/旧构建),再以固定名覆盖上传
          for name in $(gh release view "$CN_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name | select(startswith("i18n-report"))'); do
            gh release delete-asset "$CN_TAG" "$name" --repo "$GITHUB_REPOSITORY" -y
          done
          BODY="$(gh release view "$CN_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body | sed '/^构建信息:/d')"
          METADATA="$(printf '\n\n---\n\n构建信息:第 %s 次构建 · 上游 %s · %s' "${{ github.run_number }}" "${{ needs.check.outputs.upstream_tag }}" "$(date -u '+%Y-%m-%d %H:%M UTC')")"
          gh release edit "$CN_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest --notes "${BODY}${METADATA}"
          gh release upload "$CN_TAG" merged/i18n-report.json --clobber --repo "$GITHUB_REPOSITORY"
          echo "已发布: https://github.com/$GITHUB_REPOSITORY/releases/tag/$CN_TAG"
